<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJ Broadcast | Blog Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      background: #312e81;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .logout {
      background: white;
      color: #312e81;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 3px 15px #0000000a;
    }

    .panel h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .primary {
      background: #6d28d9;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    #message {
      margin-top: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .blog-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
    }

    .blog-item h3 {
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .blog-meta {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .blog-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      color: #64748b;
      padding: 10px 0;
    }

    @media (max-width: 650px) {
      header {
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>TJ Broadcast — Blog Admin</h1>
    <button class="logout" id="logoutButton">Log Out</button>
  </header>

  <main>
    <section class="panel">
      <h2 id="formHeading">Add New Blog</h2>

      <form id="blogForm">
        <div class="form-grid">
          <div class="field full">
            <label for="title">Blog title *</label>
            <input id="title" maxlength="200" required>
          </div>

          <div class="field full">
            <label for="slug">URL slug *</label>
            <input
              id="slug"
              maxlength="200"
              pattern="[a-z0-9]+(-[a-z0-9]+)*"
              title="Use lowercase letters, numbers, and hyphens."
              required
            >
          </div>

          <div class="field full">
            <label for="excerpt">Short description</label>
            <textarea id="excerpt" rows="3"></textarea>
          </div>

          <div class="field full">
            <label for="content">Blog content *</label>
            <textarea id="content" required></textarea>
          </div>

          <div class="field full">
            <label for="featuredImage">Featured image URL</label>
            <input id="featuredImage" type="url" placeholder="https://...">
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="saveButton" type="submit">
            Save Blog
          </button>
          <button class="secondary" id="cancelButton" type="button" hidden>
            Cancel Edit
          </button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Your Blog Posts</h2>
      <div id="blogList" aria-live="polite">
        Loading blogs...
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://zempldbvywmoeltqzsnv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let editingId = null;
    let currentUser = null;

    function showMessage(text, success = false) {
      $("message").textContent = text;
      $("message").style.color = success ? "#15803d" : "#b91c1c";
    }

    function makeSlug(title) {
      return title
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    $("title").addEventListener("input", () => {
      if (!editingId || !$("slug").dataset.edited) {
        $("slug").value = makeSlug($("title").value);
      }
    });

    $("slug").addEventListener("input", () => {
      $("slug").dataset.edited = "true";
    });

    async function requireAdmin() {
      const { data, error } = await supabase.auth.getUser();

      if (error || !data.user) {
        window.location.replace("./index.html");
        return false;
      }

      if (data.user.app_metadata?.role !== "admin") {
        await supabase.auth.signOut();
        window.location.replace("./index.html");
        return false;
      }

      currentUser = data.user;
      return true;
    }

    function clearForm() {
      editingId = null;
      $("blogForm").reset();
      $("slug").dataset.edited = "";
      $("formHeading").textContent = "Add New Blog";
      $("saveButton").textContent = "Save Blog";
      $("cancelButton").hidden = true;
      showMessage("");
    }

    async function loadBlogs() {
      $("blogList").textContent = "Loading blogs...";

      const { data, error } = await supabase
        .from("blogs")
        .select("id, title, slug, status, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        $("blogList").textContent =
          "Unable to load blogs: " + error.message;
        return;
      }

      $("blogList").replaceChildren();

      if (!data.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No blog posts yet. Create your first post above.";
        $("blogList").append(empty);
        return;
      }

      for (const blog of data) {
        const item = document.createElement("article");
        item.className = "blog-item";

        const title = document.createElement("h3");
        title.textContent = blog.title;

        const meta = document.createElement("p");
        meta.className = "blog-meta";
        meta.textContent =
          `${blog.status.toUpperCase()} · ${blog.slug}`;

        const actions = document.createElement("div");
        actions.className = "blog-actions";

        const editButton = document.createElement("button");
        editButton.className = "secondary";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editBlog(blog.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteBlog(blog.id));

        actions.append(editButton, deleteButton);
        item.append(title, meta, actions);
        $("blogList").append(item);
      }
    }

    async function editBlog(id) {
      const { data, error } = await supabase
        .from("blogs")
        .select("*")
        .eq("id", id)
        .single();

      if (error) {
        showMessage("Could not load blog: " + error.message);
        return;
      }

      editingId = data.id;
      $("title").value = data.title;
      $("slug").value = data.slug;
      $("slug").dataset.edited = "true";
      $("excerpt").value = data.excerpt || "";
      $("content").value = data.content;
      $("featuredImage").value = data.featured_image || "";
      $("status").value = data.status;

      $("formHeading").textContent = "Edit Blog";
      $("saveButton").textContent = "Update Blog";
      $("cancelButton").hidden = false;

      $("blogForm").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    async function deleteBlog(id) {
      if (!confirm("Permanently delete this blog post?")) return;

      const { error } = await supabase
        .from("blogs")
        .delete()
        .eq("id", id);

      if (error) {
        showMessage("Delete failed: " + error.message);
        return;
      }

      clearForm();
      await loadBlogs();
      showMessage("Blog deleted successfully.", true);
    }

    $("blogForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      $("saveButton").disabled = true;
      showMessage("Saving blog...", true);

      const title = $("title").value.trim();
      const slug = $("slug").value.trim();
      const content = $("content").value.trim();

      if (!title || !slug || !content) {
        showMessage("Please complete all required fields.");
        $("saveButton").disabled = false;
        return;
      }

      const payload = {
        title,
        slug,
        excerpt: $("excerpt").value.trim() || null,
        content,
        featured_image: $("featuredImage").value.trim() || null,
        status: $("status").value,
        updated_at: new Date().toISOString()
      };

      try {
        const result = editingId
          ? await supabase.from("blogs")
              .update(payload).eq("id", editingId)
          : await supabase.from("blogs").insert({
              ...payload,
              author_id: currentUser.id
            });

        if (result.error) throw result.error;

        clearForm();
        await loadBlogs();
        showMessage("Blog saved successfully.", true);
      } catch (error) {
        showMessage("Save failed: " + error.message);
      } finally {
        $("saveButton").disabled = false;
      }
    });

    $("cancelButton").addEventListener("click", clearForm);

    $("logoutButton").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.replace("./index.html");
    });

    if (await requireAdmin()) {
      await loadBlogs();
    }
  </script>
</body>
</html>
